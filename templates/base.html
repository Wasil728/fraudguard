<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FraudGuard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="layout d-flex">
        <nav class="sidebar bg-dark text-white p-3">
            <h5 class="mb-4 text-white">FraudGuard</h5>
            <a href="{% url 'dashboard' %}" class="nav-link text-white-50 mb-2">Dashboard</a>
            <a href="{% url 'simulator' %}" class="nav-link text-white-50 mb-2">Transaction Simulator</a>
            <a href="{% url 'alerts' %}" class="nav-link text-white-50 mb-2">Fraud Alerts</a>
            <a href="{% url 'analytics' %}" class="nav-link text-white-50 mb-2">Analytics</a>
            <a href="{% url 'settings' %}" class="nav-link text-white-50 mb-2">Settings</a>
            {% if request.user.is_staff %}
            <a href="/admin/" class="nav-link text-warning mb-2">Admin Panel</a>
            {% endif %}
            <form method="post" action="{% url 'logout' %}" class="mt-4">
                {% csrf_token %}
                <button class="btn btn-sm btn-outline-light w-100">Logout</button>
            </form>
        </nav>
        <main class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
