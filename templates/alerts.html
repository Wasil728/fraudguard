{% extends "base.html" %}
{% block title %}Fraud Alerts - FraudGuard{% endblock %}
{% block content %}
<h3>Fraud Alerts</h3>
<div class="d-flex align-items-center gap-2 my-3">
    <label class="form-label mb-0 fw-bold">Filter status:</label>
    <select id="status-filter" class="form-select w-auto">
        <option value="">All</option>
        <option value="new">New</option>
        <option value="reviewed">Reviewed</option>
        <option value="dismissed">Dismissed</option>
    </select>
</div>
<div class="card shadow-sm p-3">
    <table class="table table-hover align-middle mb-0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Risk Score</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="alerts-body">
            <tr><td colspan="6" class="text-center py-3 text-muted">Loading alerts...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadAlerts(status) {
    try {
        const response = await fetch("/api/alerts/?status=" + status);
        const alerts = await response.json();
        const body = document.getElementById("alerts-body");
        body.innerHTML = "";
        for (const a of alerts) {
            let statusBadge = "bg-secondary";
            if (a.status === "new") statusBadge = "bg-danger";
            else if (a.status === "reviewed") statusBadge = "bg-success";
            else if (a.status === "dismissed") statusBadge = "bg-warning text-dark";

            body.innerHTML += "<tr>" +
                "<td>#" + a.id + "</td>" +
                "<td>" + a.txn_type + "</td>" +
                "<td>" + a.amount + "</td>" +
                "<td class='risk-high fw-bold'>" + a.risk_score + "</td>" +
                "<td><span class='badge " + statusBadge + "'>" + a.status + "</span></td>" +
                "<td><a href='/alerts/" + a.id + "/' class='btn btn-sm btn-outline-primary'>Details</a></td></tr>";
        }
        if (alerts.length === 0) {
            body.innerHTML = "<tr><td colspan='6' class='text-center py-3 text-muted'>No alerts found.</td></tr>";
        }
    } catch (e) {
        document.getElementById("alerts-body").innerHTML = "<tr><td colspan='6' class='text-danger text-center'>Failed to load alerts.</td></tr>";
    }
}

document.getElementById("status-filter").addEventListener("change", function () {
    loadAlerts(this.value);
});
loadAlerts("");
</script>
{% endblock %}
